[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lindevwingerden", email = "linde@vanwingerden.nl" }
]
requires-python = ">=3.12"
dependencies = [
    "llm-sdk",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
]

[project.scripts]
git-personal = "git_personal:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
